<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Величина</title>
    <link rel="stylesheet" href="style4.css">
    <link rel="stylesheet" href="Theme.css">
</head>
<body>
    <header>
        <div class="header-content">
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="Calculator.html">Калькулятор</a></li>
                    <li><a href="Currency.html">Конвертер Валют</a></li>
                    <li><a href="Value.html">Конвертер Величин</a></li>
                    <li><button class="theme-toggle-btn" id="toggleThemeBtn">Сменить тему</button></li>
                </ul>
            </nav>
        </div>
    </header>
    <h1>Веб-конвертор величин</h1>
<div class="container">
  
  <label for="category">Выберите категорию:</label>
  <select id="category">
    <option value="">--Выберите--</option>
    <option value="length">Длина</option>
    <option value="mass">Масса</option>
  </select>

  <div id="length-options" style="display:none;">
    <label for="length-input">Введите значение (метры):</label>
    <input type="number" id="length-input" placeholder="например, 10" />
    
    <label for="length-from">Из:</label>
    <select id="length-from">
      <option value="meters">Метры (m)</option>
      <option value="kilometers">Километры (km)</option>
      <option value="miles">Мили (mi)</option>
      <option value="feet">Футы (ft)</option>
      <option value="inches">Дюймы (in)</option>
    </select>

    <label for="length-to">В:</label>
    <select id="length-to">
      <option value="meters">Метры (m)</option>
      <option value="kilometers">Километры (km)</option>
      <option value="miles">Мили (mi)</option>
      <option value="feet">Футы (ft)</option>
      <option value="inches">Дюймы (in)</option>
    </select>
    
    <button onclick="convertLength()">Конвертировать</button>
    
    <div class="result" id="length-result"></div>
  </div>

  <div id="mass-options" style="display:none;">
    <label for="mass-input">Введите значение (килограммы):</label>
    <input type="number" id="mass-input" placeholder="например, 5" />

    <label for="mass-from">Из:</label>
    <select id="mass-from">
      <option value="kilograms">Килограммы (kg)</option>
      <option value="grams">Граммы (g)</option>
      <option value="pounds">Фунты (lb)</option>
      <option value="ounces">Унции (oz)</option>
    </select>

    <label for "mass-to">В:</label>
    <select id= "mass-to">
      < option value= "kilograms" >Килограммы (kg)< / option >
      < option value= "grams" >Граммы (g)< / option >
      < option value= "pounds" >Фунты (lb)< / option >
      < option value= "ounces" >Унции (oz)< / option >
   </select>

   <button onclick= "convertMass()">Конвертировать</button>

   <div class= "result" id= "mass-result"></div>

</div>

</div>
<script>
// Обработчик выбора категории
document.getElementById('category').addEventListener('change', function() {
  const category = this.value;
  
  document.getElementById('length-options').style.display = 'none';
  document.getElementById('mass-options').style.display = 'none';

  if(category === 'length') {
    document.getElementById('length-options').style.display = 'block';
  } else if(category === 'mass') {
    document.getElementById('mass-options').style.display = 'block';
  }
});

// Функция для конвертации длины
function convertLength() {
  const inputVal = parseFloat(document.getElementById('length-input').value);
  const fromUnit = document.getElementById('length-from').value;
  const toUnit = document.getElementById('length-to').value;

  if(isNaN(inputVal)) {
     alert('Пожалуйста, введите корректное число.');
     return;
   }

   // Конвертация в метры как базовую единицу
   const toMetersFactors = {
     meters:1,
     kilometers:1000,
     miles:1609.34,
     feet:0.3048,
     inches:0.0254
   };

   // Конвертация из выбранной единицы в метры
   const inMeters = inputVal * toMetersFactors[fromUnit];

   // Конвертация из метров в целевую единицу
   const fromMetersFactors = {
     meters:1,
     kilometers:0.001,
     miles:1/1609.34,
     feet:1/0.3048,
     inches:1/0.0254
   };

   const result = inMeters * fromMetersFactors[toUnit];

   document.getElementById('length-result').textContent = `Результат: ${result.toFixed(4)} ${getUnitLabel(toUnit)}`;
}

// Функция для конвертации массы
function convertMass() {
 const inputVal = parseFloat(document.getElementById('mass-input').value);
 const fromUnit = document.getElementById('mass-from').value;
 const toUnit = document.getElementById('mass-to').value;

 if(isNaN(inputVal)) {
   alert('Пожалуйста, введите корректное число.');
   return;
 }

 // Базовая единица - килограмм
 const toKilogramsFactors = {
   kilograms:1,
   grams:1000,
   pounds:2.20462,
   ounces:35.274
 };

 // Конвертация из выбранной единицы в килограммы
 const inKilograms = inputVal / toKilogramsFactors[fromUnit];

 // Конвертация из килограммов в целевую единицу
 const fromKilogramsFactors = {
   kilograms:1,
   grams:0.001,
   pounds:0.453592,
   ounces:1/35.274
 };

 const result = inKilograms * fromKilogramsFactors[toUnit];

 document.getElementById('mass-result').textContent = `Результат: ${result.toFixed(4)} ${getMassUnitLabel(toUnit)}`;
}

// Вспомогательные функции для отображения названий единиц
function getUnitLabel(unit) {
 switch(unit) {
   case 'meters': return 'м';
 case 'kilometers': return 'км';
 case 'miles': return 'мили';
 case 'feet': return 'футы';
 case 'inches': return 'дюймы';
 default:return '';
 }
}

function getMassUnitLabel(unit) {
 switch(unit) {
 case 'kilograms': return 'кг';
 case 'grams': return 'г';
 case 'pounds': return 'фунты';
 case 'ounces': return 'унции';
 default:return '';
 }
}
//смена темы
const body = document.body; //кнопка смены темы
const toggleBtn = document.getElementById('toggleThemeBtn');

toggleBtn.addEventListener('click', () => {
 if (body.classList.contains('light-theme')) {
   body.classList.remove('light-theme');
   body.classList.add('dark-theme');
   toggleBtn.textContent = 'Светлая тема';
 } else {
   body.classList.remove('dark-theme');
   body.classList.add('light-theme');
   toggleBtn.textContent = 'Тёмная тема';
 }
});
</script>
</body>
</html>
