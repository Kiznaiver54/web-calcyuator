<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="Theme.css">
</head>
<body>
    <header>
        <div class="header-content">
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="Calculator.html">Калькулятор</a></li>
                    <li><a href="Currency.html">Конвертер Валют</a></li>
                    <li><a href="Value.html">Конвертер Величин</a></li>
                    <li><button class="theme-toggle-btn" id="toggleThemeBtn">Сменить тему</button></li>
                </ul>
            </nav>
        </div>
    </header>
    <h2>Калькулятор</h2>
    <div class="calculator">
  
  <input type="text" id="display" disabled />

  <div class="buttons">
    <button onclick="clearDisplay()">C</button>
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>

    <button class="operator" onclick="setOperation('+')">+</button>
    
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    
    <button class="operator" onclick="setOperation('-')">-</button>

    
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>

    
    <button class="operator" onclick="setOperation('*')">*</button>

    
    <button onclick="appendNumber('0')">0</button>
    
   
   
   
   
   
   
   
   
   
   
   <button class= "operator" onclick= "setOperation('/')">/</button>

   <!-- равно -->
   <button style= "grid-column: span 2;" onclick= "calculate()">=</button>

 </div>

</div>
<script>
    const body = document.body; //кнопка смены темы
const toggleBtn = document.getElementById('toggleThemeBtn');

toggleBtn.addEventListener('click', () => {
 if (body.classList.contains('light-theme')) {
   body.classList.remove('light-theme');
   body.classList.add('dark-theme');
   toggleBtn.textContent = 'Светлая тема';
 } else {
   body.classList.remove('dark-theme');
   body.classList.add('light-theme');
   toggleBtn.textContent = 'Тёмная тема';
 }
});
// Переменные для хранения текущего значения и операции
let currentInput = '';
let previousInput = '';
let operation = null;

// Обновление дисплея
function updateDisplay() {
 document.getElementById('display').value = currentInput || '0';
}

// Очистка дисплея
function clearDisplay() {
 currentInput = '';
 previousInput = '';
 operation = null;
 updateDisplay();
}

// Добавление числа
function appendNumber(number) {
 if (number === '.' && currentInput.includes('.')) return; // избегать двух точек
 currentInput += number;
 updateDisplay();
}

// Установка операции
function setOperation(op) {
 if (currentInput === '') return; // ничего не делать если нет числа
 if (previousInput !== '') {
 calculate(); // если есть предыдущий результат, считаем его
 }
 previousInput = currentInput;
 currentInput = '';
 operation = op;
}

// Выполнение вычисления
function calculate() {
 let prev = parseFloat(previousInput);
 let current = parseFloat(currentInput);
 if (isNaN(prev) || isNaN(current)) return;

 let result;

 switch (operation) {
   case '+':
     result = prev + current; break;
   case '-':
     result = prev - current; break;
   case '*':
     result = prev * current; break;
   case '/':
     if (current === 0) {
       alert("Деление на ноль невозможно");
       clearDisplay();
       return;
     }
     result = prev / current; break;
   default:
     return; // если операция не выбрана
 }

 currentInput = result.toString();
 previousInput = '';
 operation = null;

 updateDisplay();
}
</script>
</body>
</html>
